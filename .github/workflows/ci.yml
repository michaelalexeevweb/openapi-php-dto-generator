name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

# The job only reads the repository. Least privilege for the token, whatever the org default.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
        symfony:
          - '7'
        dependencies:
          - 'highest'
        include:
          # `config.platform.php` pins resolution to 8.3, which keeps Symfony on 7.x everywhere.
          # Symfony 8 needs PHP >= 8.4.1, so it is exercised by lifting the pin on this job only.
          - php-version: '8.4'
            symfony: '8'
            dependencies: 'highest'
          # The declared FLOORS, installed for real: a constraint nobody resolves is a guess. This
          # found `list` missing from Laravel 11.0 and dates hydrating wrong on serializer 7.4.0-7.4.5.
          - php-version: '8.3'
            symfony: '7'
            dependencies: 'lowest'

    name: tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }}, ${{ matrix.dependencies }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Resolve for the job's PHP
        if: matrix.symfony == '8'
        run: composer config platform.php 8.4.1

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Show the resolved Symfony
        run: composer show symfony/console | grep -E '^versions'

      - name: Audit dependencies
        # The lowest set is there to prove the floors, not to be audited or style-checked.
        if: matrix.dependencies == 'highest'
        run: composer audit --no-interaction

      - name: Run PHPStan
        if: matrix.dependencies == 'highest'
        run: composer phpstan

      - name: Run PHP CodeSniffer
        if: matrix.dependencies == 'highest'
        run: composer cs

      - name: Run PHP CS Fixer
        if: matrix.dependencies == 'highest'
        run: composer cs-fixer

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage

