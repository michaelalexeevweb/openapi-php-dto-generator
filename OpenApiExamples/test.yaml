openapi: 3.0.0
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: 'https'
paths:
  /api/test:
    get:
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    default: 'Access Denied.'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPostRequest'
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPatchRequest'
    patch:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPatchRequest'
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
  /api/test2:
    get:
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test2'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    default: 'Access Denied.'
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - idPostTest2
                - namePostTest2
                - surnamePostTest2
              properties:
                idPostTest2:
                  type: integer
                namePostTest2:
                  type: string
                surnamePostTest2:
                  type: string
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
    patch:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - idPatchTest2
                - namePatchTest2
              properties:
                idPatchTest2:
                  type: integer
                namePatchTest2:
                  type: string
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
  /api/test/dogs/{id}/tags/{tagId}:
    get:
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: 'uuid'
            example: '00000000-1111-2222-3333-444455556666'
          required: true
        - in: path
          name: tagId
          schema:
            type: integer
          required: true
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
    patch:
      parameters:
        - $ref: '#/components/parameters/DogId'
        - $ref: '#/components/parameters/DogTagId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
  /api/test/cats/{id}/actions/{actionId}:
    get:
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: 'uuid'
            example: '00000000-1111-2222-3333-444455556666'
          required: true
        - in: path
          name: actionId
          schema:
            type: integer
          required: true
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
    post:
      parameters:
        - $ref: '#/components/parameters/CatId'
        - $ref: '#/components/parameters/CatActionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
  /api/test/file:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
  /api/test/file/{id}:
    patch:
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: 'uuid'
            example: '00000000-1111-2222-3333-444455556666'
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileRequest'
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
    delete:
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: 'uuid'
            example: '00000000-1111-2222-3333-444455556666'
          required: true
      responses:
        200:
          description: test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
components:
  parameters:
    DogId:
      in: path
      name: id
      schema:
        type: string
        format: 'uuid'
        example: '00000000-1111-2222-3333-444455556666'
      required: true
    DogTagId:
      in: path
      name: tagId
      schema:
        type: integer
      required: true
    CatId:
      in: path
      name: id
      schema:
        type: string
        format: 'uuid'
        example: '00000000-1111-2222-3333-444455556666'
      required: true
    CatActionId:
      in: path
      name: actionId
      schema:
        type: integer
      required: true
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  schemas:
    Test:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    FileRequest:
      type: object
      required:
        - file
        - name
        - surname
      properties:
        file:
          $ref: '#/components/schemas/File'
        name:
          type: string
        surname:
          type: string
    File:
      type: string
      format: binary
    TestPostRequest:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          type: integer
        name:
          type: string
        # A union of SCALARS, unlike Animal/Animal2 below whose branches are $refs and therefore
        # become PHP classes gated by `x-php-instanceof`. With no class to gate on, the emitted
        # interpreter has to type-gate the branches itself, which is the only path that reaches
        # two pieces of code the corpus otherwise never showed in any mode:
        #   - `describeOpenApiUnionMismatch()`, the sentence naming the accepted types;
        #   - the branch type test, where a JSON `42.0` counts as an integer (JSON Schema
        #     2020-12 §6.1.1). A plain `type: integer` property never gets there — the PHP `int`
        #     type already guarantees it, so `pruneConstraintsCoveredByPhpType()` drops it.
        code:
          oneOf:
            - type: integer
              minimum: 10
              maximum: 100
            - type: string
              format: uuid
        # Two formats whose emitted helpers nothing else in the corpus reaches. `uri` is ABSOLUTE (only
        # the `*-reference` forms take a relative value) and `uri-template` needs a real RFC 6570 grammar
        # check — both were wrong in the emitted interpreter while no snapshot covered them.
        homepage:
          type: string
          format: uri
        endpoint:
          type: string
          format: uri-template
    TestPatchRequest:
      type: object
      required:
        - id
        - name
        - surname
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
    Test2:
      type: object
      required:
        - id
        - name
        - tags
        - types
      properties:
        id:
          description: this is id
          type: integer
          default: 1
        name:
          description: >
            this 
            is 
            name
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        user:
          $ref: '#/components/schemas/User'
        userType:
          type: object
          properties:
            region:
              type: string
        types:
          type: string
          enum:
            - cat
            - dog
    Tag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    TypeEnum:
      type: string
      enum:
        - catType
        - dogType
    User:
      type: object
      required:
        - id
        - name
        - pet
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        pet:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Animal2'
        createdAt:
          type: string
          format: date-time
    User2:
      type: object
      required:
        - id
        - name
        - pet
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        pet:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
            - type: object
              required:
                - test
              properties:
                test:
                  type: string
            - type: object
              required:
                - test
              properties:
                test:
                  type: string
        createdAt:
          type: string
          format: date
    Animal:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
        - type: object
          required:
            - test
          properties:
            test:
              type: string
    Animal2:
      anyOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
        - $ref: '#/components/schemas/Dog2'
        - type: object
          required:
            - test2
          properties:
            test2:
              type: string
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - meow
          properties:
            meow:
              type: string
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - bark
          properties:
            bark:
              type: string
    Dog2:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - bark
          properties:
            bark:
              type: string
    Pet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Discriminator:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - discriminator1
            - discriminator2
        name:
          type: string
          nullable: true
      discriminator:
        propertyName: type
        mapping:
          discriminator1: '#/components/schemas/Discriminator1'
          discriminator2: '#/components/schemas/Discriminator2'
    Discriminator1:
      allOf:
        - $ref: '#/components/schemas/Discriminator'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
    Discriminator2:
      allOf:
        - $ref: '#/components/schemas/Discriminator'
        - type: object
          required:
            - id
            - NAme
          properties:
            id:
              type: integer
            NAme:
              type: string
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
    Circle:
      type: object
      required:
        - kind
        - radius
      properties:
        kind:
          type: string
        radius:
          type: integer
    Square:
      type: object
      required:
        - kind
        - side
      properties:
        kind:
          type: string
        side:
          type: integer
    Containers:
      type: object
      required:
        - dates
        - shapes
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
        datesByDay:
          type: object
          additionalProperties:
            type: string
            format: date
        timestamps:
          type: array
          items:
            type: string
            format: date-time
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/Shape'
        tagsByKey:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Tag'
    # Containers INSIDE containers. Nothing is materialized below the first level of items — no DTO,
    # no enum class — so this schema is where the declarations have to stay honest and the constraints
    # have to carry the checks the PHP types cannot.
    NestedContainers:
      type: object
      required:
        - matrix
        - rowsOfMaps
      properties:
        matrix:
          type: array
          items:
            type: array
            items:
              type: integer
              minimum: 0
        rowsOfMaps:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        listsByKey:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mapsByKey:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        # A date and a `number` two deep. Neither is converted there, so the declaration is the JSON
        # value: `string` for the date, and `float|int` for the number because JSON hands `1` over as
        # an int and `1.5` as a float — one array holds both.
        dateRows:
          type: array
          items:
            type: array
            items:
              type: string
              format: date
        numRows:
          type: array
          items:
            type: array
            items:
              type: number
        enumRows:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/TypeEnum'
        tagRows:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Tag'
    # Property names a document is entitled to and PHP is not: a quote and a backslash both END a
    # single-quoted literal, so an unescaped one is a file that does not parse. Kept in the corpus
    # because `testEveryGeneratedCorpusFileParses` then answers for all five modes at once — the
    # earlier corpus had no name more awkward than camelCase, which is why runtime and yii3 shipped
    # two releases emitting broken PHP for this.
    AwkwardNames:
      type: object
      required:
        - plain
        - "it's"
      properties:
        plain:
          type: string
        "it's":
          type: string
          minLength: 2
        back\slash:
          type: string
        "both\\'s":
          type: integer
          minimum: 1
    # Scalar bounds on the ITEMS of a container, at depth one — where Symfony mode DOES emit a native
    # #[Assert\All([...])]. The callback must not carry the same keywords, or one mistake produces two
    # messages; yii3 has no per-item attribute and keeps them all. That difference is the point.
    ItemBounds:
      type: object
      required:
        - scores
      properties:
        scores:
          type: array
          items:
            type: integer
            minimum: 5
        scoresByKey:
          type: object
          additionalProperties:
            type: integer
            minimum: 5
        codes:
          type: array
          items:
            type: string
            minLength: 2
            pattern: '^[a-z]+$'
    # A union UNDER a container, with a $ref in a branch — the one shape whose constraints used to be
    # thrown away whole. On a property an inline union becomes a PHP union type and the value is a
    # generated DTO that validates itself; under a container the type collapses to `array` and the
    # branch materializes nothing, so the branch schemas have to reach the emitted constraints.
    # `TreeNode` refers to itself through such a branch: inlining it has to terminate.
    TreeNode:
      type: object
      required:
        - label
        - children
      properties:
        label:
          type: string
          minLength: 1
        children:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/TreeNode'
              - type: object
                additionalProperties:
                  $ref: '#/components/schemas/Tag'
    # The NON-recursive chain through a union branch, A -> B -> C -> D. Nothing materializes anywhere
    # on this path — under a container the branch type collapses to `array` — so there is no class on
    # the way to catch a violation, and every level has to reach the emitted constraints on its own.
    # A one-hop inline stopped at B (before 2.15.8), a two-hop one at C (2.15.8); D is here because
    # a hop CEILING can only move that border, never remove it. What removes it is the cycle guard:
    # this chain names something new at every hop, so it is inlined whole.
    ChainTag:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 2
    ChainLink:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 3
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ChainTag'
    ChainMiddle:
      type: object
      required:
        - links
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ChainLink'
    # Keywords a document states about the OBJECT AS A WHOLE, at the top level of a component. Until
    # 2.15.16 runtime mode emitted none of them and checked none — Symfony and yii3 refused the same
    # payloads — because its only schema-level slot carried the closed-object flag. Kept in the corpus
    # because the EMISSION differs per mode.
    # `uniqueItems` over SCALAR items. Emitted as Laravel's `distinct` rule until 2.15.18, and that rule
    # reports once per offending element — one duplicated pair produced two messages where every other
    # mode reports the array's single violation once. The keyword belongs to the interpreter in every
    # mode now; kept in the corpus because the EMISSION differs.
    UniqueScalars:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
    ObjectWideRules:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        code:
          type: string
        extra:
          type: string
      minProperties: 2
      dependentRequired:
        code:
          - extra
      not:
        required:
          - forbidden
      if:
        required:
          - kind
      then:
        properties:
          code:
            type: string
            minLength: 3
    # A `$ref` under an APPLICATOR — the third spelling of the same loss. Nothing materializes for
    # `contains` / `prefixItems` / `unevaluatedItems`, so a `$ref` there used to be dropped with the
    # whole keyword: the same document written INLINE refused a violating payload, written as a `$ref`
    # accepted it. Kept in the corpus because the EMISSION differs per mode.
    ApplicatorRefs:
      type: object
      required:
        - mustContain
      properties:
        mustContain:
          type: array
          items:
            type: object
          contains:
            $ref: '#/components/schemas/ChainTag'
        positions:
          type: array
          prefixItems:
            - $ref: '#/components/schemas/ChainTag'
        rest:
          type: array
          prefixItems:
            - type: string
          unevaluatedItems:
            $ref: '#/components/schemas/ChainTag'
        # The same loss in the applicators that hold a condition or a MAP of subschemas. Added in
        # 2.15.16 after the sweep: `if`/`then`/`else`, `dependentSchemas`, `propertyNames` all dropped
        # the reference and with it the whole keyword.
        conditional:
          type: object
          properties:
            label:
              type: string
          if:
            $ref: '#/components/schemas/ChainTag'
          then:
            required:
              - label
        keyed:
          type: object
          properties:
            trigger:
              type: string
          dependentSchemas:
            trigger:
              $ref: '#/components/schemas/ChainTag'
    UnionUnderContainer:
      type: object
      required:
        - tree
      properties:
        chain:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ChainMiddle'
        # The same chain under `allOf`. Skipped by the inlining until 2.15.11 on the rule that a
        # single-`$ref` `allOf` spells inheritance and gets a class — true on a property and in a map,
        # false HERE: under `items` the value is a bare `array`, nothing is written for it, and the
        # emitted constraints were `['type' => 'array']` with every level below silently unchecked.
        chainAllOf:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ChainMiddle'
        tree:
          $ref: '#/components/schemas/TreeNode'
        listOfUnions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Tag'
              - type: string
                minLength: 2
    # A component whose top level is a CONTAINER is a type ALIAS, not an object. Referenced from a
    # property that was already understood; referenced from `items` or `additionalProperties` it used
    # to be named as a class — and for `type: array` that class is never written, so a valid payload
    # died with `unknown type`, while for a map it was written EMPTY and the keys vanished in silence.
    StringList:
      type: array
      items:
        type: string
        minLength: 2
    CountMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    ContainerAliases:
      type: object
      required:
        - listOfLists
      properties:
        listOfLists:
          type: array
          items:
            $ref: '#/components/schemas/StringList'
        listOfMaps:
          type: array
          items:
            $ref: '#/components/schemas/CountMap'
        mapOfLists:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StringList'
        plain:
          $ref: '#/components/schemas/StringList'
    # `nullable` on the value of a container. It grants permission, it asserts nothing — and dropping
    # it did not relax anything, it made the callback REJECT a null the document allows. The two
    # spellings disagreed on top of that: a nullable ITEM was accepted in runtime mode while a
    # nullable map VALUE died in the cast, because only `items` was consulted for it.
    NullableContainerValues:
      type: object
      required:
        - listOfNullable
      properties:
        listOfNullable:
          type: array
          items:
            type: string
            minLength: 2
            nullable: true
        mapOfNullable:
          type: object
          additionalProperties:
            type: integer
            minimum: 5
            nullable: true
        # The 3.1 spelling of the same permission. It has to declare what the 3.0 one declares: the
        # list used to lose its item type outright and the map used to forbid the allowed null.
        listOfNullable31:
          type: array
          items:
            type:
              - string
              - "null"
        mapOfNullable31:
          type: object
          additionalProperties:
            type:
              - integer
              - "null"
